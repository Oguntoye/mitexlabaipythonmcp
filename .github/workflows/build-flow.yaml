name: Build and Deploy

on:
    push:
        branches:
            - main
            - staging
    workflow_dispatch:
        inputs:
            target_package:
                description: "Target package to update"
                required: true
                type: choice
                options:
                    - mitexlab_googlemcp
                    - mitex_mailer_mcp
                    - mitexlab_instagrammcp
                    - mitexlab_whatsappmcp
                    - all
            branch:
                description: "Branch to deploy to"
                required: true
                type: choice
                options:
                    - main
                    - staging
                default: "staging"

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set Build Parameters
              run: |
                  if [ "${{ github.event_name }}" = "push" ]; then
                    echo "TARGET_PACKAGE=all" >> $GITHUB_ENV
                    echo "BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
                  else
                    echo "TARGET_PACKAGE=${{ github.event.inputs.target_package }}" >> $GITHUB_ENV
                    echo "BRANCH=${{ github.event.inputs.branch }}" >> $GITHUB_ENV
                  fi

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push Docker image
              id: build-and-push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: anucodex/mitexlabaipythonmcp-${{ env.BRANCH }}
                  build-args: |
                      TARGET_BRANCH=${{ env.BRANCH }}
                  secrets: |
                      private_token=${{ secrets.PRIVATE_TOKEN }}
                  no-cache: true

            - name: Install doctl
              uses: digitalocean/action-doctl@v2
              with:
                  token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

            - name: Save Kubernetes configuration
              run: doctl kubernetes cluster kubeconfig save tribapay-cluster

            - name: Restart Kubernetes Deployment
              run: |
                  DEPLOYMENT_NAME="mitexlabaipythonmcp-${{ env.BRANCH }}-depl"
                  echo "Restarting ${DEPLOYMENT_NAME}"
                  kubectl rollout restart deployment ${DEPLOYMENT_NAME}
